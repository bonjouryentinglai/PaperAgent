name: Off-device checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: off-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust, Node.js and shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, pinned 2026-07-20
        with:
          components: rustfmt

      - name: Use Go from installer module
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Run off-device checks
        run: scripts/check.sh
